name: CI-CD Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v0.1.10

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}

          script: |

            # Clone repository if not exists
            if [ ! -d "awsdev" ]; then
              git clone https://github.com/Sudeshna-13/awsdev.git
            fi

            cd awsdev/"CI-CD Pipeline Project"/"Source Code"

            # Pull latest code
            git pull origin main

            # Stop old container
            docker stop awsdev || true
            docker rm awsdev || true

            # Remove old image
            docker rmi awsdev || true

            # Build Docker image
            docker build -t awsdev .

            # Run Docker container
            docker run -d -p 80:80 --name awsdev awsdev
